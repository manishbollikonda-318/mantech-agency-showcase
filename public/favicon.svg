<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <defs>
    <!-- Intense neon glow filter -->
    <filter id="neon-glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur in="SourceGraphic" stdDeviation="6" result="blur1" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="15" result="blur2" />
      <feGaussianBlur in="SourceGraphic" stdDeviation="30" opacity="0.6" result="blur3" />
      <feMerge>
        <feMergeNode in="blur3" />
        <feMergeNode in="blur2" />
        <feMergeNode in="blur1" />
        <feMergeNode in="SourceGraphic" />
      </feMerge>
    </filter>

    <!-- Metallic gradient for the outer circular ring -->
    <linearGradient id="metal-ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8fafc" />
      <stop offset="30%" stop-color="#cbd5e1" />
      <stop offset="50%" stop-color="#64748b" />
      <stop offset="70%" stop-color="#cbd5e1" />
      <stop offset="100%" stop-color="#475569" />
    </linearGradient>

    <!-- Deep blue background glow for contrast -->
    <radialGradient id="ambient-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#1e3a8a" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#020617" stop-opacity="0" />
    </radialGradient>
  </defs>

  <!-- Ambient background glow (helps blend with website) -->
  <circle cx="256" cy="256" r="240" fill="url(#ambient-glow)" />

  <!-- Outer Metallic Circle Bezel -->
  <circle cx="256" cy="256" r="210" stroke="url(#metal-ring)" stroke-width="14" />
  
  <!-- Outer Glow Ring (Inner edge of metallic ring) -->
  <circle cx="256" cy="256" r="195" stroke="#3b82f6" stroke-width="4" filter="url(#neon-glow)" opacity="0.9" />
  <circle cx="256" cy="256" r="195" stroke="#93c5fd" stroke-width="1.5" opacity="0.95" />

  <!-- Stylized M Neon Badge (Double-stroke Neon Tube Effect) -->
  <g filter="url(#neon-glow)">
    <!-- Base thick blue neon tubes -->
    <!-- Left outer leg -->
    <path d="M 155 350 L 155 200 L 256 300 M 256 300 L 357 200 L 357 350" stroke="#2563eb" stroke-width="18" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Inner legs -->
    <path d="M 195 340 L 195 240 L 256 300 M 256 300 L 317 240 L 317 340" stroke="#2563eb" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <!-- Center U-loop -->
    <path d="M 225 290 C 225 335, 287 335, 287 290" stroke="#2563eb" stroke-width="14" stroke-linecap="round" />
    
    <!-- Neon Core (Medium Blue Glow) -->
    <path d="M 155 350 L 155 200 L 256 300 M 256 300 L 357 200 L 357 350" stroke="#3b82f6" stroke-width="12" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 195 340 L 195 240 L 256 300 M 256 300 L 317 240 L 317 340" stroke="#3b82f6" stroke-width="8" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 225 290 C 225 335, 287 335, 287 290" stroke="#3b82f6" stroke-width="10" stroke-linecap="round" />
    
    <!-- White-Hot Neon Center Core -->
    <path d="M 155 350 L 155 200 L 256 300 M 256 300 L 357 200 L 357 350" stroke="#eff6ff" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 195 340 L 195 240 L 256 300 M 256 300 L 317 240 L 317 340" stroke="#eff6ff" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" />
    <path d="M 225 290 C 225 335, 287 335, 287 290" stroke="#eff6ff" stroke-width="3.5" stroke-linecap="round" />
  </g>
</svg>